name: ci-flow
on:
  push:
    branches:
      - main
jobs:
  build:
    run-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
     
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test