name: ci/cd

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vetapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pSLoS1245kIND"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: copy code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: build jar
        run: mvn clean package -DskipTests

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot.jar
          path: target/*.jar

  docker:
    needs: build
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: copy code
        uses: actions/checkout@v4

      - name: download jar
        uses: actions/download-artifact@v4
        with:
          name: spring-boot.jar
          path: target/

      - name: dockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/springboot-kubernetes-project:${{ github.run_number }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/springboot-kubernetes-project:${{ github.run_number }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: ''

      - name: push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-kubernetes-project:${{ github.run_number }}


  update-manifest:
    needs: docker
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image in deployment
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/springboot-kubernetes-project:${{ github.run_number }}|" k8s/manifest/app.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add k8s/manifest/app.yaml
          git commit -m "Update image to build ${{ github.run_number }} [skip ci]"
          git push


