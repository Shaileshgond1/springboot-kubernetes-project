apiVersion: apps/v1
kind: Deployment
metadata:
  name: apppod
  namespace: application

spec:
  replicas: 3

  selector:
    matchLabels:
      city: pune

  template:
    metadata:
      labels:
        city: pune

    spec:
      containers:
        - name: mycon
          image: sw1236/springboot-kubernetes-project:98

          startupProbe:
            httpGet:
              path: /actuator/prometheus
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 32

          livenessProbe:
            httpGet:
              path: /actuator/prometheus
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5 
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/prometheus
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "300Mi"
            limits:
              cpu: "150m"
              memory: "500Mi"