name: Continous-Deployment

on:
  workflow_run:
    workflows: ["Continous-Integration"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v5
        with:
          name: spring-boot.jar
          path: target
          run-id: ${{ github.event.workflow_run.id }}

      - name: docker hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/springboot-kubernetes-project:latest .

      - name: pushing docker image to docker hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-kubernetes-project:latest